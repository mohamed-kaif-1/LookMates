<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">LOOKMATES</title>
  <desc id="desc">Find Your Fit. Match Your Vibe. AI virtual try-on and coordinated fashion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="1" stop-color="#10172A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7BA7FF" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1000" cy="90" r="110" fill="#2563EB" opacity=".18" filter="url(#glow)"/>
  <circle cx="1020" cy="220" r="86" fill="#60A5FA" opacity=".12" filter="url(#glow)"/>
  <g transform="translate(850 58)" fill="none" stroke="url(#blue)" stroke-width="3">
    <rect x="0" y="0" width="128" height="214" rx="18" opacity=".95"/>
    <rect x="148" y="0" width="128" height="214" rx="18" opacity=".95"/>
    <path d="M30 46h68M178 46h68" stroke="#93C5FD" stroke-width="2" opacity=".8"/>
    <path d="M35 78l29 -14 29 14 -10 46H45Z" fill="#3B82F6" fill-opacity=".32" stroke="#60A5FA"/>
    <path d="M183 78l29 -14 29 14 -10 46H193Z" fill="#8B5CF6" fill-opacity=".24" stroke="#A78BFA"/>
    <path d="M32 148h64M180 148h64" stroke="#64748B" stroke-width="2"/>
    <path d="M54 180h20M202 180h20" stroke="#64748B" stroke-width="2"/>
    <path d="M128 108h20" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 4"/>
  </g>
  <g transform="translate(70 70)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="#1D4ED8" fill-opacity=".22" stroke="#3B82F6" stroke-opacity=".8"/>
    <circle cx="17" cy="16" r="4" fill="#60A5FA"/>
    <text x="30" y="21" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#BFDBFE">FASHION TECH</text>
    <text x="0" y="112" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="2" fill="#FFFFFF">LOOK<tspan fill="#60A5FA">MATES</tspan></text>
    <rect x="0" y="132" width="86" height="5" rx="2.5" fill="url(#blue)"/>
    <text x="0" y="177" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#E2E8F0">Find Your Fit. Match Your Vibe.</text>
    <text x="0" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94A3B8">AI virtual try-on  /  Coordinated looks  /  Shared style</text>
